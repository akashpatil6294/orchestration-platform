# Local production-like stack: API + worker + Postgres.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up --build
#
# API: http://127.0.0.1:8000  (docs at /docs, metrics at /metrics)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://orchestrator:orchestrator@db:5432/orchestrator
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # One-shot: mint the worker credential after migrations have run and share
  # it with the worker through a volume. No manual WORKER_TOKEN needed.
  bootstrap-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@db:5432/orchestrator
    volumes:
      - worker-token:/run/orchestrator
    command: ["python", "-m", "app.cli", "create-worker", "--worker-id", "compose-worker", "--concurrency", "4", "--token-file", "/run/orchestrator/worker-token"]
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@db:5432/orchestrator
      ORCHESTRATOR_API: http://api:8000
      WORKER_ID: compose-worker
    volumes:
      - worker-token:/run/orchestrator:ro
    command: ["sh", "-c", "export WORKER_TOKEN=$$(cat /run/orchestrator/worker-token) && exec python -m app.sample_worker"]
    depends_on:
      bootstrap-worker:
        condition: service_completed_successfully

volumes:
  pgdata:
  worker-token:
