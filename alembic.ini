# Alembic configuration.
#
# The database URL is intentionally NOT set here: migrations/env.py reads it from
# the application settings (and therefore from DATABASE_URL / .env), so there is
# exactly one place that decides which database is being migrated.
#
#   python -m app.cli migrate                # upgrade to head
#   alembic revision --autogenerate -m "..." # after changing models
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy_module_prefix = sa.
timezone = UTC
# File names are timestamped so revisions sort chronologically in review.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S